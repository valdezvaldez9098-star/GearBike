<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios — GearBike</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* ── Tabla de usuarios ── */
        .usuarios-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .usuarios-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--navy);
        }
        .tabla-usuarios-wrap {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .tabla-usuarios {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .tabla-usuarios th {
            background: var(--navy);
            color: var(--white);
            padding: 11px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .4px;
        }
        .tabla-usuarios td {
            padding: 11px 16px;
            border-bottom: 1px solid var(--gray);
            color: var(--text);
        }
        .tabla-usuarios tr:last-child td { border-bottom: none; }
        .tabla-usuarios tr:hover td { background: rgba(249,115,22,.04); }

        .acciones-cell { display: flex; gap: 8px; align-items: center; }
        .btn-accion {
            width: 32px; height: 32px;
            border: none; border-radius: 8px;
            cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .btn-editar  { background: rgba(59,130,246,.10); }
        .btn-editar:hover  { background: rgba(59,130,246,.22); }
        .btn-eliminar { background: rgba(239,68,68,.10); }
        .btn-eliminar:hover { background: rgba(239,68,68,.22); }

        .badge-admin {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            background: rgba(249,115,22,.15);
            color: var(--orange);
            letter-spacing: .3px;
        }

        /* ── Modal formulario ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(15,23,42,.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.visible { display: flex; }
        .modal-box {
            background: var(--white);
            border-radius: 14px;
            padding: 28px 30px 24px;
            width: 360px;
            max-width: 94vw;
            box-shadow: 0 20px 60px rgba(0,0,0,.22);
        }
        .modal-box h3 {
            font-size: 17px;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 18px;
        }
        .modal-box .form-group {
            margin-bottom: 14px;
        }
        .modal-box label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--navy-mid);
            margin-bottom: 5px;
            letter-spacing: .3px;
        }
        .modal-box input[type="text"],
        .modal-box input[type="password"] {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid var(--gray);
            border-radius: var(--radius);
            font-size: 14px;
            box-sizing: border-box;
            background: var(--white);
            color: var(--text);
            transition: border-color .2s, box-shadow .2s;
        }
        .modal-box input:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(249,115,22,.15);
        }
        .modal-box input:disabled {
            background: var(--gray);
            color: var(--gray-mid);
            cursor: not-allowed;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 18px;
        }
        .form-error {
            color: #e53e3e;
            font-size: 13px;
            margin-top: 6px;
            min-height: 18px;
        }

        /* ── Modal confirmación ── */
        .confirm-box {
            background: var(--white);
            border-radius: 14px;
            padding: 26px 28px 22px;
            width: 320px;
            max-width: 94vw;
            box-shadow: 0 20px 60px rgba(0,0,0,.22);
            text-align: center;
        }
        .confirm-box .confirm-icon { font-size: 40px; margin-bottom: 10px; }
        .confirm-box p {
            font-size: 14px;
            color: var(--text);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .confirm-box strong { color: var(--navy); }
        .btn-danger {
            padding: 9px 20px;
            background: #e53e3e;
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
        }
        .btn-danger:hover { background: #c53030; }

        /* ── Responsivo ── */
        @media (max-width: 640px) {
            .col-id { display: none; }
            .tabla-usuarios th:first-child,
            .tabla-usuarios td:first-child { display: none; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <button class="sidebar-toggle" aria-label="Abrir menú">&#9776;</button>
    <div class="sidebar-overlay"></div>
    <nav class="sidebar">
        <div class="sidebar-header">
            <img src="img/logo.png" alt="GearBike" class="sidebar-logo">
            <div class="sidebar-brand">Gear<span>Bike</span></div>
            <span class="brand-sub">POS Bicicletas</span>
        </div>
        <ul class="nav-menu">
            <li><a href="dashboard.html">📊 Dashboard</a></li>
            <li><a href="ventas.html">🧾 Ventas</a></li>
            <li><a href="productos.html">📦 Productos</a></li>
            <li id="menuUsuarios"><a href="usuarios.html" class="active">👥 Usuarios</a></li>
            <li><a href="#" id="logoutBtn">🔓 Cerrar Sesión</a></li>
        </ul>
        <div class="user-info">
            Bienvenido, <span id="userName"></span>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            <h1 class="page-title">Administración de Usuarios</h1>
        </header>

        <div class="usuarios-header">
            <h1>Usuarios registrados</h1>
            <button class="btn-secondary" onclick="abrirNuevo()">+ Nuevo Usuario</button>
        </div>

        <div class="tabla-usuarios-wrap">
            <table class="tabla-usuarios">
                <thead>
                    <tr>
                        <th class="col-id">ID</th>
                        <th>Nombre de usuario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="usuariosTable">
                    <tr><td colspan="3">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- ── Modal nuevo/editar usuario ── -->
<div id="usuarioModal" class="modal-overlay">
    <div class="modal-box">
        <h3 id="modalTitle">Nuevo Usuario</h3>
        <form id="usuarioForm" autocomplete="off">
            <div class="form-group">
                <label for="inputNombre">Nombre de usuario *</label>
                <input type="text" id="inputNombre" maxlength="80" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="inputPassword" id="lblPassword">Contraseña *</label>
                <input type="password" id="inputPassword" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="inputPassword2">Confirmar contraseña</label>
                <input type="password" id="inputPassword2" autocomplete="new-password">
            </div>
            <p class="form-error" id="formError"></p>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button type="submit" class="btn-primary" style="width:auto;padding:9px 22px;">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- ── Modal confirmación eliminar ── -->
<div id="confirmModal" class="modal-overlay">
    <div class="confirm-box">
        <div class="confirm-icon">⚠️</div>
        <p>¿Eliminar al usuario <strong id="confirmNombre"></strong>?<br>Esta acción no se puede deshacer.</p>
        <div style="display:flex;gap:10px;justify-content:center">
            <button class="btn-secondary" onclick="cerrarConfirm()">Cancelar</button>
            <button class="btn-danger" id="btnConfirmEliminar">Eliminar</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
